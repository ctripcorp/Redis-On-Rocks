name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  mem:
    name: mem (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            os: linux
          - platform: ubuntu-24.04-arm
            os: linux
          - platform: macos-latest
            os: macos
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install dependencies (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get -y install libsnappy-dev zlib1g-dev libstdc++6 liburing-dev libevent-dev libgoogle-glog-dev tcl

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos'
        run: |
          brew install snappy zlib gflags tcl-tk

      - name: Build Redis-On-Rocks
        run: |
          if [ "${{ matrix.os }}" = "macos" ]; then
            make -j$(sysctl -n hw.ncpu)
          else
            make -j$(nproc)
          fi

      - name: Test
        run: make test

  mem-asan:
    name: mem-asan (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install libsnappy-dev zlib1g-dev libstdc++6 liburing-dev libevent-dev libgoogle-glog-dev tcl

      - name: Build with ASan
        run: make SANITIZER=address -j$(nproc)

      - name: Test ASan
        run: make test-asan

  swap:
    name: swap (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Get rocksdb sha
        id: rocksdb-sha
        run: |
          ROCKSDB_SHA=$(cd deps/rocksdb && git rev-parse HEAD)
          echo "ROCKSDB_SHA is $ROCKSDB_SHA"
          echo "ROCKSDB_SHA=$ROCKSDB_SHA" >> $GITHUB_ENV
        shell: bash

      - name: Cache rocksdb
        id: cache-rocksdb
        uses: actions/cache@v6
        with:
          path: deps/rocksdb
          key: ${{ runner.os }}-${{ runner.arch }}-rocksdb-${{ env.ROCKSDB_SHA }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install libsnappy-dev zlib1g-dev libstdc++6 liburing-dev libevent-dev libgoogle-glog-dev tcl

      - name: Build SWAP
        run: make SWAP=1 -j$(nproc)

      - name: Test SWAP
        run: |
          LD_LIBRARY_PATH=$PWD/deps/rocksdb/_build_folly/libs/glog/lib:$PWD/deps/rocksdb/_build_folly/libs/libevent/lib make SWAP=1 test

  swap-asan:
    name: swap-asan (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Get rocksdb sha
        id: rocksdb-sha
        run: |
          ROCKSDB_SHA=$(cd deps/rocksdb && git rev-parse HEAD)
          echo "ROCKSDB_SHA is $ROCKSDB_SHA"
          echo "ROCKSDB_SHA=$ROCKSDB_SHA" >> $GITHUB_ENV
        shell: bash

      - name: Cache rocksdb
        id: cache-rocksdb
        uses: actions/cache@v6
        with:
          path: deps/rocksdb
          key: ${{ runner.os }}-${{ runner.arch }}-rocksdb-${{ env.ROCKSDB_SHA }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install libsnappy-dev zlib1g-dev libstdc++6 liburing-dev libevent-dev libgoogle-glog-dev tcl

      - name: Build SWAP ASan
        run: make SWAP=1 SANITIZER=address -j$(nproc)

      - name: Test SWAP ASan
        run: |
          LD_LIBRARY_PATH=$PWD/deps/rocksdb/_build_folly/libs/glog/lib:$PWD/deps/rocksdb/_build_folly/libs/libevent/lib make SWAP=1 test-asan

  unit:
    name: unit-test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Get rocksdb sha
        id: rocksdb-sha
        run: |
          ROCKSDB_SHA=$(cd deps/rocksdb && git rev-parse HEAD)
          echo "ROCKSDB_SHA is $ROCKSDB_SHA"
          echo "ROCKSDB_SHA=$ROCKSDB_SHA" >> $GITHUB_ENV
        shell: bash

      - name: Cache rocksdb
        id: cache-rocksdb
        uses: actions/cache@v6
        with:
          path: deps/rocksdb
          key: ${{ runner.os }}-${{ runner.arch }}-rocksdb-${{ env.ROCKSDB_SHA }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install libsnappy-dev zlib1g-dev libstdc++6 liburing-dev libevent-dev libgoogle-glog-dev tcl

      - name: Run unit test
        run: |
          LD_LIBRARY_PATH=$PWD/deps/rocksdb/_build_folly/libs/glog/lib:$PWD/deps/rocksdb/_build_folly/libs/libevent/lib make SWAP=1 unit-test -j$(nproc)
